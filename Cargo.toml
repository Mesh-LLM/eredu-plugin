[package]
name = "eredu-plugin"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Local Eredu inference endpoint for Mesh LLM"

[features]
default = []
mlx = ["dep:eredu", "dep:eredu-core", "dep:eredu-backend-mlx", "eredu/mlx", "eredu-backend-mlx/metal", "eredu-backend-mlx/accelerate"]

[dependencies]
anyhow = "1"
axum = "0.8"
async-stream = "0.3"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
mesh-llm-plugin = { git = "https://github.com/Mesh-LLM/mesh-llm.git", rev = "bc215ce5b880e21c6c3840b8574ab64f83278821" }
eredu = { git = "https://github.com/jbg/eredu", rev = "465cf519fc5e0f90a40072320aa1d546103fbcc8", default-features = false, optional = true }
eredu-core = { git = "https://github.com/jbg/eredu", rev = "465cf519fc5e0f90a40072320aa1d546103fbcc8", optional = true }
eredu-backend-mlx = { git = "https://github.com/jbg/eredu", rev = "465cf519fc5e0f90a40072320aa1d546103fbcc8", default-features = false, optional = true }

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
